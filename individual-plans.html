<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام الحماية الشرطي لتصوير الشاشة</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f7f6;

        /* منع تحديد أو تظليل النصوص */
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }
      .form-container {
        background: white;
        padding: 25px;
        border-radius: 8px;
        max-width: 400px;
        margin: 30px auto;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .form-group {
        margin-bottom: 20px;
      }
      label {
        font-weight: bold;
        display: block;
        margin-bottom: 5px;
      }
      input {
        padding: 10px;
        width: 100%;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;

        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        user-select: text;
      }
      button {
        padding: 12px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        width: 100%;
      }
      button:hover {
        background-color: #218838;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <h2>استمارة بيانات المدرسة</h2>
      <p style="color: #c0392b; font-size: 13px; font-weight: bold">
        ملاحظة أمنية: تصوير الشاشة متاح فقط بعد إدخال رقم مدرسة صحيح ومسجل.
      </p>

      <form id="protectionForm">
        <div class="form-group">
          <label>رقم المدرسة:</label>
          <input type="text" id="schoolId" value="سجل رقم المدرسة" />
        </div>

        <div class="form-group">
          <label>اسم المدرسة (يظهر تلقائياً):</label>
          <input
            type="text"
            id="schoolName"
            placeholder="سيظهر الاسم هنا"
            readonly
          />
        </div>

        <button type="submit">إرسال البيانات</button>
      </form>
    </div>

    <script>
      // ==========================================
      // 1. قاعدة بيانات المدارس المسجلة
      // ==========================================
      const schoolsDatabase = {
        1001: "مدرسة الأمل الابتدائية",
        1002: "مدرسة الفتح الإعدادية",
        1003: "مدرسة النور الثانوية للبنات",
      };

      const schoolIdInput = document.getElementById("schoolId");
      const schoolNameInput = document.getElementById("schoolName");

      // تحديث اسم المدرسة تلقائياً أثناء كتابة الرقم
      schoolIdInput.addEventListener("input", function () {
        const idValue = this.value.trim();
        if (schoolsDatabase[idValue]) {
          schoolNameInput.value = schoolsDatabase[idValue];
          this.style.border = "2px solid #28a745";
        } else {
          schoolNameInput.value = "";
          this.style.border = "";
        }
      });

      // ==========================================
      // 2. دالة صفارة المنبه الصوتي
      // ==========================================
      function playBeepAlarm() {
        try {
          const audioCtx = new (
            window.AudioContext || window.webkitAudioContext
          )();
          const oscillator = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();

          oscillator.type = "sawtooth";
          oscillator.frequency.setValueAtTime(1500, audioCtx.currentTime);

          gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + 0.8,
          );

          oscillator.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          oscillator.start();
          oscillator.stop(audioCtx.currentTime + 0.8);
        } catch (error) {
          console.log("يجب النقر في الصفحة لتفعيل الصوت.");
        }
      }

      // ==========================================
      // 3. دالة فحص صحة البيانات (تُرجع true إذا كانت سليمة و false إذا كانت خاطئة)
      // ==========================================
      function isDataValid() {
        const idValue = schoolIdInput.value.trim();

        // البيانات سليمة فقط إذا كان الرقم موجوداً في قاعدة البيانات واسم المدرسة يطابقها
        if (
          idValue !== "" &&
          idValue !== "سجل رقم المدرسة" &&
          schoolsDatabase[idValue] &&
          schoolNameInput.value === schoolsDatabase[idValue]
        ) {
          return true;
        }
        return false;
      }

      // ==========================================
      // 4. تشغيل المنبه عند ضغط زر الإرسال (إذا كانت البيانات خاطئة)
      // ==========================================
      const form = document.getElementById("protectionForm");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        if (!isDataValid()) {
          playBeepAlarm(); // تشغيل المنبه
          schoolIdInput.style.border = "2px solid red";
          alert(
            "تنبيه أمني: لا يمكنك الإرسال، رقم المدرسة غير صحيح أو الحقل فارغ!",
          );
        } else {
          schoolIdInput.style.border = "2px solid #28a745";
          alert(`تم التحقق بنجاح! جاري الدخول إلى: ${schoolNameInput.value}`);
        }
      });

      // ==========================================
      // 5. رصد طبع الشاشة (Print Screen) المشروط بالبيانات
      // ==========================================
      window.addEventListener("keyup", function (event) {
        if (
          event.key === "PrintScreen" ||
          event.keyCode === 44 ||
          event.code === "PrintScreen"
        ) {
          // فحص شرطك: إذا لم تكن الخلايا كما يريدها الكود (خاطئة)
          if (!isDataValid()) {
            document.body.style.display = "none"; // حجب الشاشة فوراً جعلها بيضاء
            playBeepAlarm(); // تشغيل المنبه فوراً

            if (navigator.clipboard) {
              navigator.clipboard.writeText(""); // تفريغ الحافظة لحذف الصورة الملتقطة
            }

            alert(
              "تنبيه أمني: تم حظر تصوير الشاشة وتشغيل المنبه لأن بيانات المدرسة غير صحيحة!",
            );
            document.body.style.display = "block"; // إعادة إظهار المحتوى بعد الضغط على موافق
          } else {
            // إذا كانت البيانات صحيحة تماماً كما في قاعدة البيانات:
            console.log("تم السماح بتصوير الشاشة لأن البيانات صحيحة وسليمة.");
          }
        }
      });

      // نفس الشرط يطبق على اختصار الطباعة Ctrl + P
      window.addEventListener("keydown", function (event) {
        if (
          (event.ctrlKey && event.key === "p") ||
          (event.ctrlKey && event.keyCode === 80)
        ) {
          if (!isDataValid()) {
            event.preventDefault(); // منع الطباعة
            playBeepAlarm(); // تشغيل المنبه
            alert("تنبيه أمني: محاولة الطباعة محظورة لأن البيانات غير مكتملة!");
          }
        }
      });

      // إعادة إظهار الصفحة كإجراء احتياطي
      window.addEventListener("click", function () {
        document.body.style.display = "block";
      });

      // منع القائمة اليمنى والنسخ
      document.addEventListener("contextmenu", (event) =>
        event.preventDefault(),
      );
      document.addEventListener("copy", (event) => event.preventDefault());

      // رصد مغادرة المستخدم للصفحة أو فتح قائمة التطبيقات في الهاتف
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          // إخفاء كل شيء فوراً إذا خرج أو فتح قائمة التطبيقات
          document.body.style.display = "none";
          playBeepAlarm(); // تشغيل المنبه
        } else {
          // يعود المحتوى فقط إذا رجع وكانت البيانات سليمة
          if (isDataValid()) {
            document.body.style.display = "block";
          } else {
            document.body.style.display = "none";
          }
        }
      });
    </script>
  </body>
</html>
